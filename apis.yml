aid: bittorrent
name: BitTorrent
description: >-
  BitTorrent is the company behind the BitTorrent peer-to-peer file-sharing
  protocol and the uTorrent and BitTorrent desktop and web torrent clients, one
  of the most widely deployed distributed content-delivery technologies on the
  internet. Now part of the TRON ecosystem, BitTorrent also operates BitTorrent
  Chain (BTTC) — a layer-2 proof-of-stake cross-chain scaling and interoperability
  network bridging TRON, Ethereum, and BSC — along with the BTT token, the BTFS
  decentralized storage layer, and BitTorrent Speed. Its developer surface spans
  the local uTorrent Web UI API for controlling torrent clients and the BitTorrent
  Chain developer documentation for building on the BTTC network. Surfaced as a
  portfolio company of dcm-ventures and enriched into the API Evangelist network.
